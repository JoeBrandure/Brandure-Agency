# Netlify configuration for brandure.io.
#
# The Astro site lives in site/. Everything else in this repo is the agency's
# system of record and is not part of the deploy.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- IndexNow ------------------------------------------------------------
# Pings Bing, Yandex, Seznam, Naver and Yep on a production deploy, at
# onPostBuild, and ships the response code in the deploy at
# /indexnow-status.json. Google does not participate, so nothing here affects
# Google. The path is resolved against `base` above, so this is
# site/netlify/plugins/.
[[plugins]]
  package = "/netlify/plugins/indexnow"

# --- Security and caching -----------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# The manifest, declared rather than inferred. Netlify maps .webmanifest
# itself, but a wrong type here means the icons silently never install.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Brand assets are fetched from outside the site — the email signature loads
# the GIF in a mail client, and decks and profiles hotlink the logos — so they
# are explicitly cacheable and explicitly cross-origin readable. They are not
# content-hashed, so a month, not a year: replacing a file has to take effect.
# The one brand URL with a hard external dependency: the email signature loads
# exactly this file in mail clients, which are unforgiving about type. Declared
# rather than inferred for the same reason as the manifest above.
[[headers]]
  for = "/brand/brandure-signature-animated.gif"
  [headers.values]
    Content-Type = "image/gif"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    Access-Control-Allow-Origin = "*"

# --- Canonical host ------------------------------------------------------
# One canonical version: apex, no www. Netlify serves HTTPS and redirects
# HTTP automatically once the certificate is issued.
[[redirects]]
  from = "https://www.brandure.io/*"
  to = "https://brandure.io/:splat"
  status = 301
  force = true

# --- /service → /services ------------------------------------------------
# The page moved on 2026-11-17 when it stopped being about one service. The
# old URL has been published for months, so it redirects rather than 404s.
# A browser reapplies the fragment itself across a 301, so /service#buy,
# /service#book and /service#report all land on the matching anchor — the ids
# are unchanged on the new page for exactly that reason.
#
# /service never had children. The splat rule exists because a stray
# /service/pricing in somebody's CMS should reach the page rather than the
# 404, and it sends all of them to /services rather than to a child path that
# has never existed.
# Piece 3 was rebuilt on 2026-11-25 around its AI Overview findings and
# renamed with it, so the published URL had to change. The old one has been
# live and linked since September, so it redirects rather than 404s.
[[redirects]]
  from = "/research/gemini-routes-into-google-feeds-dubai"
  to = "/research/google-ai-overview-dubai"
  status = 301

[[redirects]]
  from = "/service"
  to = "/services"
  status = 301

[[redirects]]
  from = "/service/*"
  to = "/services"
  status = 301

# --- Sitemap alias ------------------------------------------------------
# Astro emits sitemap-index.xml. Plenty of tools, and some crawlers, try
# /sitemap.xml first and give up on a 404, so point it at the real one.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# --- Legacy domains ------------------------------------------------------
# These rules only take effect once each domain is added as a domain alias
# on this Netlify site. Adding an alias changes that domain's WEB records
# only. See "Pointing the legacy domains" in site/README.md before touching
# brandureai.com — it carries live Google Workspace mail.
[[redirects]]
  from = "https://brandureai.com/*"
  to = "https://brandure.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.brandureai.com/*"
  to = "https://brandure.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://branduredigital.com/*"
  to = "https://brandure.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.branduredigital.com/*"
  to = "https://brandure.io/:splat"
  status = 301
  force = true
